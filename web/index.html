<!DOCTYPE html>
<html lang="en">
<head>

    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="MyPod is an iPod-inspired web music player with a click wheel, offline local music, playlists, customizable themes and games.">
    <link rel="canonical" href="https://nivednb.github.io/MyPod/">
    <meta property="og:title" content="MyPod - iPod-inspired offline music player">
    <meta property="og:description" content="Play your local music and playlists with a classic click wheel, customizable themes and games.">
    <meta property="og:url" content="https://nivednb.github.io/MyPod/">
    <meta property="og:type" content="website">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151515">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="MyPod">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.ico"/>

    <title>MyPod - iPod-inspired offline music player</title>
    <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#151515;color:#fff">
<noscript>
  <style>#boot-status { display: none !important; } main { padding: 2rem; font-family: system-ui, sans-serif; }</style>
  <main>
    <h1>MyPod: an iPod-inspired web music player</h1>
    <p>MyPod plays your local music and playlists with a classic click wheel, customizable themes and games. JavaScript is required to use the player.</p>
    <p>MyPod is an independent edition based on ClassiPod by Aditya R.</p>
  </main>
</noscript>
<div id="boot-status" role="status" style="position:fixed;inset:0;display:grid;place-content:center;text-align:center;font:16px system-ui">
  <p>MyPod</p><p style="font-size:13px;color:#aaa">Opening your player…</p>
</div>
<script src="jsmediatags.min.js"></script>
<script src="browser_library.js"></script>
<script src="wheel_audio.js"></script>
<script>
  window.addEventListener('flutter-first-frame', () => document.getElementById('boot-status')?.remove());
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('personal-player-sw.js').catch(console.warn);
    });
  }
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
